[platformio]
default_envs = esp8266_4M1M

[core8266]
platform = espressif8266@2.6.3
platform_packages = framework-arduinoespressif8266 @ https://github.com/esp8266/Arduino.git#2.7.4
f_cpu = 160000000L
framework = arduino
board = esp12e
;board_build.filesystem = littlefs
board_build.ldscript      = eagle.flash.4m2m.ld
build_flags = 
    -DPIO_FRAMEWORK_ARDUINO_MMU_CACHE16_IRAM48_SECHEAP_SHARED
    -DVTABLES_IN_FLASH
upload_speed = 460800
monitor_speed = 115200
lib_deps =
  ArduinoJson@6.19.1
  me-no-dev/AsyncTCP@1.1.1
  me-no-dev/ESPAsyncUDP @ 0.0.0-alpha+sha.697c75a025
  https://github.com/lorol/ESPAsyncWebServer
  AsyncMqttClient@0.9.0
  miguelbalboa/MFRC522 @ ^1.4.12
  matjack1/Wiegand Protocol Library for Arduino - for esp-rfid@^1.1.1
  paulstoffregen/Time@^1.6.1
  Bounce2@2.52

; boards which GPIO0 and RESET controlled using two NPN transistors as nodemcu devkit (includes wemos d1 mini)
[core8266generic]
board_build.f_cpu = ${core8266.f_cpu}
platform = ${core8266.platform}
framework = ${core8266.framework}
board = ${core8266.board}
;upload_resetmethod = nodemcu
lib_deps = ${core8266.lib_deps}
extra_scripts = scripts/GENdeploy.py
build_flags = ${core8266.build_flags}
upload_speed = ${core8266.upload_speed}
monitor_speed = ${core8266.monitor_speed}
board_build.flash_mode = dio

; generic firmware for debugging purposes
[core8266debug]
board_build.f_cpu = ${core8266.f_cpu}
platform = ${core8266.platform}
framework = ${core8266.framework}
board = ${core8266.board}
lib_deps = ${core8266.lib_deps}
build_flags = ${core8266.build_flags}
		-DDEBUG
extra_scripts = scripts/DBGdeploy.py
upload_speed = ${core8266.upload_speed}
monitor_speed = ${core8266.monitor_speed}
 
[env:esp8266_4M1M]
extends  = core8266debug
board = d1_mini
upload_port = /dev/cu.usbserial-A5069RR4